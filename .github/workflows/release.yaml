name: release

# Windows release for this fork. A manual run builds the installers and keeps
# them as run artifacts; pushing a v* tag also verifies the changelog and publishes
# them with its notes. The app updates itself from these assets: tool/package.dart
# names them FlClash-<version>-windows-<arch>-setup.exe next to
# FlClash-<version>-SHA256SUMS (lib/common/release_asset.dart).
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.50.0'
  GO_VERSION: '1.27.1'

jobs:
  build:
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            arch: amd64
          - os: windows-11-arm
            arch: arm64
            flutter-channel: master
    steps:
      - name: Setup rust
        if: matrix.arch == 'arm64'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://win.rustup.rs/aarch64" -OutFile rustup-init.exe
          .\rustup-init.exe -y --default-toolchain stable
          Add-Content $env:GITHUB_PATH "$env:USERPROFILE\.cargo\bin"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: core/go.sum

      - name: Enable git long paths
        run: git config --global core.longpaths true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.flutter-channel || 'stable' }}
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Get Flutter Dependency
        run: |
          flutter --version
          flutter pub get

      - name: Fetch CA certificates
        shell: bash
        env:
          CA_BUNDLE: cacert-2026-09-25.pem
          CA_BUNDLE_SHA256: a41b5d356aea97a529fe27e0f7316d2f9d946d75927476cf9cf1b90637d00505
        run: |
          bundle=core/Clash.Meta/component/ca/ca-certificates.crt
          curl -fsSL --retry 3 -o "$bundle" "https://curl.se/ca/$CA_BUNDLE"
          echo "$CA_BUNDLE_SHA256  $bundle" | sha256sum -c -

      # `dart run` would first run every build hook for this runner; the packager builds them itself.
      - name: Setup
        run: dart tool/package.dart windows --arch ${{ matrix.arch }} --env stable -v

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: artifact-windows-${{ matrix.arch }}
          path: ./dist

  notes:
    name: Release notes
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Get Flutter Dependency
        run: flutter pub get

      - name: Skip the Go core build hook
        run: yq -i '.hooks.user_defines.setup.build_assets = false' pubspec.yaml

      - name: Verify changelog
        run: dart run tool/changelog.dart verify

      # The update dialog reads these notes from the release body.
      - name: Render notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          target=()
          if [[ "$TAG" == *-* ]]; then
            dart run tool/changelog.dart build --unreleased
          else
            target=(--tag "$TAG")
          fi
          dart run tool/changelog.dart render release "${target[@]}" --out release.md

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release.md

  publish:
    name: Publish
    needs: [ build, notes ]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download
        uses: actions/download-artifact@v4
        with:
          pattern: artifact-*
          path: ./artifacts

      - name: Download notes
        uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: ./notes

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      - name: Install dependencies
        run: flutter pub get

      - name: Skip native build hooks
        run: |
          yq -i '.hooks.user_defines.setup.build_assets = false | .hooks.user_defines.rust_api.build_assets = false' pubspec.yaml

      # One manifest.json and one FlClash-<version>-SHA256SUMS for both arches.
      - name: Merge the build manifests
        run: dart run tool/package.dart merge artifacts/* --out dist

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          body_path: ./notes/release.md
          generate_release_notes: true
